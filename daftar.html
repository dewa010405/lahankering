<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Form Login & Daftar</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(rgba(245,230,211,0.85), rgba(245,230,211,0.85)),
                  url('https://www.rumahmesin.com/wp-content/uploads/2024/04/rahasia-bisnis-bawang-merah.jp') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      position: relative;
    }
    .container {
      background-color: #fff;
      border-radius: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 700px;
      height: 400px;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    .left-panel {
      background:
      linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
      url('https://www.rumahmesin.com/wp-content/uploads/2024/04/rahasia-bisnis-bawang-merah.jpg')
      center/cover no-repeat;
      color: white;
      padding: 40px 30px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      transition: all 0.6s ease;
      z-index: 2;
    }
    .container.swapped .left-panel { left: 50%; }
    .left-panel h2 {
      margin: 0 0 10px;
      font-weight: bold;
      font-size: 24px;
    }
    .left-panel p {
      margin: 10px 0 20px;
      font-size: 14px;
    }
    .btn-register {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 8px 25px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      width: fit-content;
      transition: background-color 0.3s;
      font-size: 14px;
    }
    .btn-register:hover {
      background-color: #0056b3;
    }
    .right-panel {
      padding: 40px 30px;
      flex: 1;
      width: 50%;
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      overflow-y: auto;
      transition: all 0.6s ease;
    }
    .container.swapped .right-panel { right: 50%; }
    .right-panel h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
      font-size: 24px;
    }
    .input-group {
      position: relative;
      margin-bottom: 12px;
    }
    .input-group input {
      width: 100%;
      padding: 10px 35px 10px 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 13px;
      transition: border 0.3s;
    }
    .input-group input:focus {
      border-color: #8b1e3f;
      outline: none;
    }
    .input-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
      font-size: 14px;
    }
    .forgot-password {
      text-align: center;
      margin: -5px 0 15px;
      font-size: 12px;
      color: #555;
      cursor: pointer;
    }
    .btn-login {
      width: 100%;
      padding: 10px;
      background-color: #007BFF;
      color: white;
      font-weight: bold;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background-color 0.3s;
    }
    .btn-login:hover {
      background-color: #0056b3;
    }
    .register-form { display: none; }
    .container.swapped .login-form { display: none; }
    .container.swapped .register-form { display: block; }
    .login-form, .register-form { animation: fadeIn 0.5s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 20px;
      border-radius: 5px;
      color: white;
      font-weight: bold;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .success { background-color: #4CAF50; }
    .error { background-color: #f44336; }
    .show { opacity: 1; }
    
    .container {
      backdrop-filter: blur(6px);
      background: rgba(255,255,255,0.92);
      border: 2px solid rgba(139,30,63,0.15);
    }

    .left-panel {
      background:
      linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
      url('https://www.rumahmesin.com/wp-content/uploads/2024/04/rahasia-bisnis-bawang-merah.jpg')
      center/cover no-repeat;
    }

    .right-panel h2 {
      color: #8b1e3f;
    }

    .input-group input:focus {
      box-shadow: 0 0 8px rgba(139,30,63,0.2);
    }

  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <!-- Notifikasi -->
  <div id="notification" class="notification"></div>
  
  <div class="container" id="mainContainer">
    <div class="left-panel">
      <h2>Budidaya Bawang Merah</h2>
      <p>Belum punya akun?</p>
      <button class="btn-register" onclick="togglePanels()">Daftar</button>
    </div>

    <div class="right-panel">
      <div class="login-form">
        <h2>Masuk</h2>
        <form id="loginForm">
          <div class="input-group">
            <input type="email" id="loginEmail" placeholder="Email" required />
            <i class="fas fa-envelope input-icon"></i>
          </div>
          <div class="input-group">
            <input type="password" id="loginPassword" placeholder="Kata Sandi" required />
            <i class="fas fa-lock input-icon"></i>
          </div>
          <button type="submit" class="btn-login">Masuk</button>
        </form>
      </div>

      <div class="register-form">
        <h2>Daftar</h2>
        <form id="registerForm">
          <div class="input-group">
            <input type="text" id="registerName" placeholder="Nama Lengkap" required />
            <i class="fas fa-user input-icon"></i>
          </div>
          <div class="input-group">
            <input type="email" id="registerEmail" placeholder="Email" required />
            <i class="fas fa-envelope input-icon"></i>
          </div>
          <div class="input-group">
            <input type="password" id="registerPassword" placeholder="Kata Sandi" required />
            <i class="fas fa-lock input-icon"></i>
          </div>
          <div class="input-group">
            <input type="password" id="confirmPassword" placeholder="Konfirmasi Kata Sandi" required />
            <i class="fas fa-lock input-icon"></i>
          </div>
          <button type="submit" class="btn-login">Daftar</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Fungsi toggle panel login/daftar
    function togglePanels() {
      const container = document.getElementById('mainContainer');
      const leftPanel = container.querySelector('.left-panel');
      const btnRegister = leftPanel.querySelector('.btn-register');
      container.classList.toggle('swapped');
      if (container.classList.contains('swapped')) {
        leftPanel.querySelector('h2').textContent = 'Panen Bawang Merah';
        leftPanel.querySelector('p').textContent = 'Sudah punya akun?';
        btnRegister.textContent = 'Masuk';
      } else {
        leftPanel.querySelector('h2').textContent = 'Budidaya Bawang Merah';
        leftPanel.querySelector('p').textContent = "Belum punya akun?";
        btnRegister.textContent = 'Daftar';
      }
    }

    // Fungsi notifikasi
    function showNotification(message, isSuccess) {
      const notification = document.getElementById('notification');
      notification.textContent = message;
      notification.className = `notification ${isSuccess ? 'success' : 'error'} show`;
      setTimeout(() => notification.classList.remove('show'), 3000);
    }

    // Fungsi redirect
    function redirectToUMKM(userData) {
      localStorage.setItem('currentUser', JSON.stringify(userData));
      const redirectUrl = localStorage.getItem('redirectAfterLogin');
      if (redirectUrl) {
        localStorage.removeItem('redirectAfterLogin');
        window.location.href = redirectUrl;
      } else {
        window.location.href = 'petani.html';
      }
    }
  </script>

  <script>
    // REGISTER menggunakan Local Storage
    document.getElementById("registerForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const name = document.getElementById("registerName").value;
      const email = document.getElementById("registerEmail").value;
      const password = document.getElementById("registerPassword").value;
      const confirm = document.getElementById("confirmPassword").value;

      if (password !== confirm) {
        showNotification("Kata sandi tidak cocok!", false);
        return;
      }

      if (password.length < 6) {
        showNotification("Kata sandi minimal 6 karakter!", false);
        return;
      }

      let users = JSON.parse(localStorage.getItem("users")) || [];

      const existingUser = users.find(user => user.email === email);

      if (existingUser) {
        showNotification("Email sudah digunakan", false);
        return;
      }

      const newUser = {
        id: Date.now(),
        name: name,
        email: email,
        password: password
      };

      users.push(newUser);
      localStorage.setItem("users", JSON.stringify(users));

      showNotification("Pendaftaran berhasil!", true);

      setTimeout(() => {
        redirectToUMKM({
          id: newUser.id,
          name: newUser.name,
          email: newUser.email
        });
      }, 1500);

      e.target.reset();
    });

    // LOGIN menggunakan Local Storage
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      let users = JSON.parse(localStorage.getItem("users")) || [];

      const user = users.find(
        user => user.email === email && user.password === password
      );

      if (user) {
        showNotification(
          "Login berhasil! Selamat datang " + user.name,
          true
        );

        setTimeout(() => {
          redirectToUMKM({
            id: user.id,
            name: user.name,
            email: user.email
          });
        }, 1500);

        e.target.reset();
      } else {
        showNotification("Login gagal: Email atau kata sandi salah", false);
      }
    });
  </script>
</body>
</html>
